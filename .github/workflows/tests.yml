name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (errors only)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.33"

      # Only rules that mean a real defect: syntax errors, undefined or
      # redefined names, broken comparisons and bare except clauses.
      # Style rules stay advisory until the import order is reviewed by hand.
      - name: Check for real defects
        run: >
          uvx ruff@0.17.0 check --isolated
          --select E9,F63,F7,F82,F811,F402,F502,F601,F602,F632,E722
          manga_translator desktop_qt_ui packaging test

  pytest:
    name: Pytest (Windows, Python 3.12, CPU)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.33"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        run: uv python install 3.12

      - name: Sync CPU dependencies
        run: uv sync --locked --no-default-groups --group cpu --group test

      - name: Run all tests
        run: uv run --no-sync pytest test
